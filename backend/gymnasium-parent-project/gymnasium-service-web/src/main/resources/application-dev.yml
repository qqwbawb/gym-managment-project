#配置端口号
server:
  port: 8089
#数据库相关配置
spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://localhost:3306/gym_system
    username: root
    password: root
#mybaits-plus配置
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl #将日志信息输出到控制台
  global-config:
    db-config:
      update-strategy: not_empty #只更新非空和非null的
#定义日志输出格式
logging:
  pattern:
    console: '%d{yyyy-MM-dd} [%thread] %-5level %logger- %msg%n'